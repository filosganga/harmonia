[package]
name = "harmonia"
version = "0.2.0"
edition = "2024"
description = "Turns parts, fits them on a perfboard and wires them up, with a tiny neural network as a judge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/filosganga/harmonia"
readme = "README.md"

[dependencies]
rand = "0.9"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: read numbers back exactly as written, so a layout file read and written again is the same.
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
debug = false
