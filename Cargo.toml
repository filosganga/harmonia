[package]
name = "harmonia"
version = "0.1.0"
edition = "2024"
description = "Turns parts, fits them on a perfboard and wires them up, with a tiny neural network as a judge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/filosganga/harmonia"
readme = "README.md"

[dependencies]
# The placing network (src/placing.rs). "flex" is Burn's pure-Rust CPU backend.
burn = { version = "0.22", features = ["flex"] }
rand = "0.9"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
